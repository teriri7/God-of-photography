name: 自动构建 Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci || npm install

      - name: 编译 Web 前端产物
        run: npm run build

      - name: 同步 Capacitor 资源到 Android
        run: npx cap sync android

      - name: 设置 Java 17 (Gradle 运行环境)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 设置 Android SDK 构建工具
        uses: android-actions/setup-android@v3

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 执行 Gradle 编译 Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/PinkLayer-Studio-latest.apk

      - name: 上传 APK 构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PinkLayer-Studio-APK
          path: build-output/PinkLayer-Studio-latest.apk
          retention-days: 30

      - name: 自动创建 Release 发布 (如果是 Tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/PinkLayer-Studio-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
